<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldLVD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F1DC" />
      <stop offset="35%" stop-color="#DFBA73" />
      <stop offset="70%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9A7B48" />
    </linearGradient>

    <!-- Subtle Outer Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C5A880" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9A7B48" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Deep Warm Onyx Background with Elegant Rounded Corners -->
  <rect width="512" height="512" rx="120" fill="#141312" />

  <!-- Subtle Inset Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#goldBorder)" stroke-width="6" />

  <!-- Luxury Monogram LV -->
  <g fill="url(#goldLVD)" font-family="'Bodoni Moda', 'Playfair Display', 'Didot', 'Cinzel', 'Georgia', serif" font-weight="700" text-anchor="middle">
    <!-- Star Accent -->
    <path d="M 256 100 L 260 118 L 278 122 L 260 126 L 256 144 L 252 126 L 234 122 L 252 118 Z" fill="url(#goldLVD)" opacity="0.9" />
    
    <!-- Monogram Letters LV -->
    <text x="256" y="340" font-size="210" letter-spacing="-8" style="font-style: italic;">
      LV
    </text>
  </g>

  <!-- Subtle Studio Subline -->
  <text x="256" y="415" fill="url(#goldLVD)" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="28" font-weight="600" letter-spacing="12" text-anchor="middle" opacity="0.75">
    LVD
  </text>
</svg>
